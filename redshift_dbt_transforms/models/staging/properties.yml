version: 2

models:
  - name: stg_ed_events
    description: "Stages the raw ED data at event level"
    columns:
      - name: event_id
        tests:
          - unique
          - not_null
      - name: attendance_id
        tests:
          - not_null
      - name: patient_key
        tests:
          - not_null
      - name: event_type
        tests:
          - not_null
      - name: event_ts
        tests:
          - not_null
      - name: recorded_ts
        tests:
          - not_null        
      - name: source_system
        tests:
          - not_null                                           

